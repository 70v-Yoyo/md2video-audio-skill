[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "md2video-audio-skill"
version = "1.0.1"
description = "One Markdown file + a one-click command = presentation-style video with synchronized narration. ｜ 一个 Markdown 文件 + 一键命令 = 专业级口播视频。"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [
    { name = "70v-Yoyo" }
]
keywords = [
    "ai-agent",
    "mcp",
    "claude-code",
    "markdown-to-video",
    "text-to-speech",
    "video-generation"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Video :: Conversion",
]

[project.urls]
Homepage = "https://github.com/70v-Yoyo/md2video-audio-skill"
Bug-Tracker = "https://github.com/70v-Yoyo/md2video-audio-skill"
Repository = "https://github.com/70v-Yoyo/md2video-audio-skill"

[tool.hatch.build.targets.wheel]
# 强行让 PyPI 打包当前目录下的所有核心文件，确保 scripts、SKILL.md 和所有 .md 笔记不被过滤
packages = ["."]

[project.scripts]
md2video = "scripts.ai_2md2marp2av:main"
